services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lexdb
      POSTGRES_USER: lex
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lexdev}
    ports:
      - "5433:5432" # 5432 del host lo ocupa otro Postgres local; no tocarlo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lex -d lexdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    volumes:
      - ./data/project-files:/app/data/project-files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://lex:${DB_PASSWORD:-lexdev}@db:5432/lexdb
      META_API_KEY: ${META_API_KEY:-}
      META_BASE_URL: ${META_BASE_URL:-https://api.meta.ai/v1}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
      META_EMBED_MODEL: ${META_EMBED_MODEL:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-bge-m3}
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  web:
    build: ./apps/web
    depends_on:
      - api
    ports:
      - "4173:4173"

volumes:
  pgdata:
  ollama:
  redisdata:
